name: E2E test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  cypress:
    name: E2E Tests
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
    - name: Build plugin
      run: npm run build -- --skip-zip
    - name: Set up WP environment
      run: npm run env:start
    - name: Run Cypress
      run: npm run cypress:run
